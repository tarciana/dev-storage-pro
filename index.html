<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Storage Pro - Professional Edition</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen p-4 md:p-8 transition-colors duration-500">
    <div class="max-w-5xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
            <h1 class="text-4xl font-black dark:text-white">Dev<span class="text-indigo-600">Storage</span>.</h1>
            <div class="flex items-center gap-4">
                <input type="text" id="search-input" placeholder="Pesquisar..." class="pl-4 pr-4 py-3 rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-200 dark:ring-slate-800 text-slate-700 dark:text-white outline-none">
                <button id="theme-toggle" class="p-3 rounded-2xl bg-white dark:bg-slate-900 shadow-sm border border-slate-200 dark:border-slate-800">
                    <span id="theme-icon">🌙</span>
                </button>
            </div>
        </header>

        <div id="loading-state" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="h-64 rounded-3xl skeleton"></div>
            <div class="h-64 rounded-3xl skeleton"></div>
        </div>

        <div id="user-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- Scripts em ordem: Lógica primeiro, App depois -->
    <script src="assets/js/logic.js"></script>
    <script src="assets/js/app.js"></script>
</body>
